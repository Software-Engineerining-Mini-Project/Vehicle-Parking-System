name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: flake8 + pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # QA-POR-01: the app must run unchanged on Windows and Linux with Python 3.10+
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint with flake8
        run: python -m flake8 .

      - name: Run tests
        run: python -m pytest -v
