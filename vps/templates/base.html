<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Vehicle Parking System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a class="brand" href="{{ url_for('index') }}">Vehicle Parking System</a>
        <nav>
            {% if current_user %}
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('parking.entry_page') }}">Vehicle Entry</a>
            <a href="{{ url_for('parking.exit_page') }}">Vehicle Exit</a>
            <a href="{{ url_for('slots.slots_page') }}">Slot Grid</a>
            {% if current_user.role == 'ADMIN' %}
            <a href="{{ url_for('reports.reports_page') }}">Reports</a>
            {% endif %}
            <span class="user">{{ current_user.username }} ({{ role_labels[current_user.role] }})</span>
            <form method="post" action="{{ url_for('auth.logout') }}" class="logout">
                <button type="submit">Log out</button>
            </form>
            {% else %}
            <a href="{{ url_for('auth.login') }}">Log in</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
