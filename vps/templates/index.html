<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vehicle Parking System</title>
</head>
<body>
    <h1>Vehicle Parking System</h1>
    <p>The application and database are set up. Slots loaded from the default layout:</p>
    <table border="1" cellpadding="6">
        <tr><th>Category</th><th>Total</th><th>Vacant</th></tr>
        {% for row in rows %}
        <tr><td>{{ row.category }}</td><td>{{ row.total }}</td><td>{{ row.vacant }}</td></tr>
        {% endfor %}
    </table>
</body>
</html>
